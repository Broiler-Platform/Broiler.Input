name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          # The neutral contracts, the Android backends, and the evdev
          # providers. This configuration excludes every net10.0-windows
          # project, so no Windows host is involved.
          - os: ubuntu-latest
            configuration: Release-Linux
          # The neutral contracts, the Android backends, and the Windows
          # providers. The contract runner targets net10.0-windows, so this is
          # the only leg that builds and runs it.
          - os: windows-latest
            configuration: Release-Windows

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Broiler.Input.slnx -c ${{ matrix.configuration }} --nologo

      # The suites are self-hosted console runners, not a test framework, so
      # there is nothing for `dotnet test` to discover. See eng/run-tests.sh.
      - name: Test
        run: bash ./eng/run-tests.sh ${{ matrix.configuration }}

      # Proves the packages still build from this commit. No single
      # configuration produces the whole set - Release-Windows omits the three
      # evdev packages and Release-Linux omits the five Windows ones - so both
      # are packed here. The Windows host can do both, because the evdev
      # libraries are plain net10.0 with no runtime identifier. Publishing is a
      # separate, deliberate action - see .github/workflows/publish.yml.
      - name: Pack
        if: matrix.os == 'windows-latest'
        run: |
          dotnet pack Broiler.Input.slnx -c Release-Windows --nologo -o ./artifacts
          dotnet pack Broiler.Input.slnx -c Release-Linux   --nologo -o ./artifacts
          echo "Packed:"
          ls -1 ./artifacts

      - name: Upload packages
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*
          if-no-files-found: error
