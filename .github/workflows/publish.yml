name: Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which feed to publish to
        type: choice
        options:
          - github
          - nuget
        default: github
      version-suffix:
        description: 'Optional preview.N (must be unused and at least the next preview). Empty selects automatically.'
        type: string
        default: ''
      dry-run:
        description: Pack and upload the artifact, but do not push to the feed
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  # Every branch and tag shares the version sequence.
  group: publish
  cancel-in-progress: false

jobs:
  # Both provider families are exercised before anything is pushed. Without
  # this, a tag push would publish a commit whose evdev suite never ran: the
  # publish job is a Windows host, and the Linux runner is built linux-x64.
  validate:
    name: Validate ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            configuration: Release

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Broiler.Input.slnx -c ${{ matrix.configuration }} --nologo

      - name: Test
        run: bash ./eng/run-tests.sh ${{ matrix.configuration }}

      - name: Test preview version selection
        run: node --test eng/resolve-preview-version.test.mjs

  publish:
    name: Publish to ${{ github.event_name == 'push' && 'nuget' || inputs.target }}
    needs: validate
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    env:
      # A tag push is always a real nuget.org release. A manual run chooses,
      # and defaults to a dry run so the workflow is safe to try out.
      TARGET: ${{ github.event_name == 'push' && 'nuget' || inputs.target }}
      DRY_RUN: ${{ github.event_name == 'push' && 'false' || inputs.dry-run }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        env:
          VERSION_SUFFIX: ${{ inputs.version-suffix }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node eng/resolve-preview-version.mjs

      - name: Require a NuGet.org API key
        if: env.TARGET == 'nuget' && env.DRY_RUN != 'true'
        run: |
          if [ -z "${{ secrets.NUGET_API_KEY }}" ]; then
            echo "::error::Publishing to nuget.org needs the NUGET_API_KEY repository secret."
            exit 1
          fi

      # Both configurations, because neither one alone covers the suite. The
      # neutral and Android packages fall out of both; the builds are
      # deterministic, so the second pack reproduces them byte for byte.
      - name: Pack
        run: |
          set -euo pipefail
          dotnet pack Broiler.Input.slnx -c Release --nologo ${{ steps.version.outputs.version_args }} -o ./artifacts
          echo "Packed:"
          ls -1 ./artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ steps.version.outputs.version }}
          path: artifacts/*
          if-no-files-found: error

      # GitHub Packages does not accept snupkg symbol packages, hence
      # --no-symbols. The feed owner must match the package RepositoryUrl,
      # which SourceLink fills in from this checkout's origin.
      - name: Push to GitHub Packages
        if: env.TARGET == 'github' && env.DRY_RUN != 'true'
        run: >
          dotnet nuget push artifacts/*.nupkg
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --no-symbols

      # Pushing a .nupkg also pushes the .snupkg sitting beside it.
      - name: Push to NuGet.org
        if: env.TARGET == 'nuget' && env.DRY_RUN != 'true'
        run: >
          dotnet nuget push artifacts/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.NUGET_API_KEY }}

      - name: Summary
        run: |
          {
            echo "### Broiler.Input ${{ steps.version.outputs.version }}"
            echo
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run - packages were built and attached to this run, nothing was pushed."
            else
              echo "Pushed to \`$TARGET\`."
            fi
            echo
            echo '```'
            ls -1 ./artifacts
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
